[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
markers =
    db: needs a Postgres database (set TEST_DATABASE_URL)
    browser: launches CloakBrowser (run with RUN_BROWSER_TESTS=1)
filterwarnings =
    ignore::DeprecationWarning
