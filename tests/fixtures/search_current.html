  <li class="slContainer"><div data-product-id="1111" class="product-list-item grid-view"></div></li>

  <li data-product-id="2222" class="product-list-item grid-view"><div class="skeleton-product-grid-view"></div></li>

    <button data-testid="plp-sold-out-3333">Sold Out</button>
  </li>
</ol>

<ul><li class="item c-carousel-item" data-product-id="9999"><a class="sku-title" href="/x">Carousel item</a></li></ul>
<script>

  const state = {
    'Product:{"skuId":"1111","openBoxCondition":null}': {
      __typename: 'Product', skuId: '1111',
      name: {__typename: 'ProductName', short: 'HP - 14" Laptop - Silver'},
      url: {__typename: 'ProductUrl', skuSpecificUrl: 'https://www.bestbuy.com/product/hp-14-laptop/JJ1/sku/1111'},

      manufacturer: {modelNumber: '14-dq6105dx'},

      reviewInfo: {averageRating: 4.7, reviewCount: 92},

</body></html>
